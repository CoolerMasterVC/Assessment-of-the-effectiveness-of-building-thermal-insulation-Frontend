[package]
name = "thermal-insulation"
version = "0.1.0"
description = "Приложение для расчета теплоизоляции"
authors = ["Your Name"]
license = "MIT"
edition = "2021"
build = "build.rs"

[build-dependencies]
tauri-build = { version = "1.0", features = [] }

[dependencies]
tauri = { version = "1.0", features = [ "fs-read-file", "shell-open", "fs-write-file"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
webbrowser = "0.5"
parking_lot = "0.12"  # Для Mutex

[features]
# Для production сборки
custom-protocol = ["tauri/custom-protocol"]
